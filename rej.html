<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect - Login</title>

    <style>
        body {
            background-color: #f2f6ff;
            font-family: Arial;
            margin: 0;
        }

        .login-box {
            width: 400px;
            margin: 80px auto;
            background-color: white;
            border: 2px solid #1e5eff;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 5px 5px 5px 8px gray;
        }

        h1 {
            text-align: center;
            color: #1e5eff;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 30px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #1e5eff;
            color: white;
            border: none;
            border-radius: 20px;
        }

        button:hover {
            background-color: #1648c0;
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #1e5eff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>CampusConnect</h1>

        <h2>Login</h2>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="login.html">Register</a>
        </p>

        <p>
            <a href="prj2.html">Back to Home</a>
        </p>

    </div>

</body>
</html>
