<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect - Register</title>

    <style>
        body {
            background-color: #f2f6ff;
            font-family: Arial;
        }

        .register-box {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border: 2px solid #1e5eff;
            border-radius: 30px;
        }

        h1 {
            text-align: center;
            color: #1e5eff;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #1e5eff;
            color: white;
            border: none;
            border-radius: 20px;
        }

        button:hover {
            background-color: #1648c0;
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #1e5eff;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>CampusConnect</h1>

    <h2>Register</h2>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm your password">

        <label>Role</label>
        <select>
            <option>Student</option>
            <option>Placement Officer</option>
        </select>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="rej.html">Login</a>
    </p>

    <p>
        <a href="prj2.html">Back to Home</a>
    </p>

</div>

</body>
</html>
