<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect - Student Profile</title>

    <style>
        body {
            background-color: #f2f6ff;
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            background-color: #1e5eff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .profile {
            width: 600px;
            margin: 30px auto;
            background-color: white;
            border: 2px solid #1e5eff;
            padding: 30px;
            border-radius: 30px;
        }

        h1 {
            color: #1e5eff;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 20px;
        }

        textarea {
            height: 80px;
        }

        button {
            background-color: #1e5eff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 20px;
            border-radius: 15px;
        }

        button:hover {
            background-color: #1648c0;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>CampusConnect</h2>

        <div>
            <a href="stddashb.html">Dashboard</a>
            <a href="stdprf.html">Profile</a>
            <a href="myapp.html">Applications</a>
            <a href="prj2.html">Logout</a>
        </div>

    </div>


    <div class="profile">

        <h1>Student Profile</h1>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="text" placeholder="Enter your phone number">

            <label>Department</label>
            <input type="text" placeholder="Enter your department">

            <label>Skills</label>
            <textarea placeholder="Example: HTML, CSS, Java, C++, SQL"></textarea>

            <label>Projects</label>
            <textarea placeholder="Enter your projects"></textarea>

            <label>Resume</label>
            <input type="file">

            <button type="submit">Save Profile</button>

        </form>

    </div>

</body>
</html>
